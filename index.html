<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEXC Futures Pro Scanner</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body class="bg-[#121214] text-white font-sans p-4 select-none">

    <div class="max-w-md mx-auto">
        <!-- Статус -->
        <div class="bg-[#1a1a1e] p-3 rounded-xl mb-4 border border-gray-800 text-xs flex justify-between items-center">
            <div>
                <span class="font-bold text-emerald-400">⚡ PRO TECHNICAL SCANNER</span>
                <div class="text-gray-500 text-[10px]">RSI + EMA + Volume Engine</div>
            </div>
            <span class="bg-emerald-500/10 text-emerald-400 px-2 py-1 rounded font-mono text-[10px]">Live 15m</span>
        </div>

        <!-- Шапка с выбором монеты -->
        <div class="flex justify-between items-center bg-[#1a1a1e] p-3 rounded-xl mb-4 border border-gray-800">
            <span class="font-bold text-sm tracking-wider text-purple-400">🔥 ФЬЮЧЕРСЫ</span>
            <button onclick="toggleModal()" id="selected-pair" class="flex items-center gap-2 bg-[#2a2a33] px-3 py-1.5 rounded-lg text-sm font-semibold hover:bg-[#353542] transition">
                <span>🟣 SOLUSDT (Futures)</span>
                <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
            </button>
        </div>

        <!-- Карточка сигнала -->
        <div class="bg-[#1a1a1e] p-5 rounded-2xl border border-gray-800 shadow-xl text-center relative overflow-hidden">
            <div id="scan-status" class="text-xs text-gray-400 uppercase tracking-widest mb-1">Ожидание анализа рынка</div>
            
            <div id="signal-direction" class="text-3xl font-black text-gray-500 my-2">ГОТОВ К АНАЛИЗУ</div>
            
            <div class="grid grid-cols-2 gap-2 my-4 text-sm">
                <div class="bg-[#131315] p-2.5 rounded-xl border border-gray-800/50">
                    <div class="text-gray-500 text-xs">Точка входа</div>
                    <div id="stat-price" class="font-bold text-base">--</div>
                </div>
                <div class="bg-[#131315] p-2.5 rounded-xl border border-gray-800/50">
                    <div class="text-gray-500 text-xs">RSI (15m)</div>
                    <div id="stat-rsi" class="font-bold text-base text-blue-400">--</div>
                </div>
                <div class="bg-[#131315] p-2.5 rounded-xl border border-gray-800/50">
                    <div class="text-gray-500 text-xs text-red-400">Стоп-лосс</div>
                    <div id="stat-stop" class="font-bold text-base text-red-400">--</div>
                </div>
                <div class="bg-[#131315] p-2.5 rounded-xl border border-gray-800/50">
                    <div class="text-gray-500 text-xs text-green-400">Тейк-профит</div>
                    <div id="stat-take" class="font-bold text-base text-green-400">--</div>
                </div>
            </div>

            <!-- Кнопки управления -->
            <div class="space-y-2.5">
                <button id="gen-btn" onclick="analyzeTechnicalSignal()" class="w-full bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white font-bold py-3.5 px-4 rounded-xl shadow-lg transition transform active:scale-95">
                    🎯 АНАЛИЗАТОР СВЕЧЕЙ (RSI + EMA)
                </button>
                
                <button id="scan-btn" onclick="scanWildMarket()" class="w-full bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 text-white font-bold py-3 px-4 rounded-xl shadow-lg transition transform active:scale-95 text-sm">
                    🔥 ИСКАТЬ ТОП-ИМПУЛЬС (LIVE)
                </button>
            </div>
        </div>
    </div>

    <!-- Модальное окно -->
    <div id="modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden flex items-end justify-center z-50">
        <div class="bg-[#1a1a1e] w-full max-w-md rounded-t-3xl p-5 border-t border-gray-800">
            <div class="flex justify-between items-center mb-4">
                <h3 class="font-bold text-lg">Выбор фьючерса</h3>
                <button onclick="toggleModal()" class="text-gray-400 font-bold text-lg">&times;</button>
            </div>
            <div class="space-y-2 max-h-60 overflow-y-auto">
                <div onclick="selectPair('SOLUSDT', 'SOL/USDT', '🟣')" class="p-3 bg-[#2a2a33] rounded-xl flex justify-between items-center cursor-pointer hover:bg-[#353542]"><span>Solana (SOLUSDT)</span><span class="text-purple-400 text-sm font-bold">Futures</span></div>
                <div onclick="selectPair('BTCUSDT', 'BTC/USDT', '₿')" class="p-3 bg-[#2a2a33] rounded-xl flex justify-between items-center cursor-pointer hover:bg-[#353542]"><span>Bitcoin (BTCUSDT)</span><span class="text-green-400 text-sm">Futures</span></div>
                <div onclick="selectPair('ETHUSDT', 'ETH/USDT', 'Ξ')" class="p-3 bg-[#2a2a33] rounded-xl flex justify-between items-center cursor-pointer hover:bg-[#353542]"><span>Ethereum (ETHUSDT)</span><span class="text-blue-400 text-sm">Futures</span></div>
            </div>
        </div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        let currentSymbol = "SOLUSDT";
        let currentName = "SOL/USDT";
        let currentFlag = "🟣";

        function toggleModal() {
            document.getElementById('modal').classList.toggle('hidden');
        }

        function selectPair(symbol, name, flag) {
            currentSymbol = symbol;
            currentName = name;
            currentFlag = flag;
            document.getElementById('selected-pair').innerHTML = `<span>${flag} ${name} (Futures)</span><svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>`;
            toggleModal();
        }

        function setScannedPair(symbol, name, flag) {
            currentSymbol = symbol;
            currentName = name;
            currentFlag = flag;
            document.getElementById('selected-pair').innerHTML = `<span>${flag} ${name} (Futures)</span><svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>`;
        }

        // Расчет RSI по массиву цен закрытия
        function calculateRSI(closes, period = 14) {
            if (closes.length < period + 1) return 50;
            let gains = 0, losses = 0;
            for (let i = 1; i <= period; i++) {
                let diff = closes[i] - closes[i - 1];
                if (diff >= 0) gains += diff;
                else losses -= diff;
            }
            let avgGain = gains / period;
            let avgLoss = losses / period;
            
            for (let i = period + 1; i < closes.length; i++) {
                let diff = closes[i] - closes[i - 1];
                if (diff >= 0) {
                    avgGain = (avgGain * (period - 1) + diff) / period;
                    avgLoss = (avgLoss * (period - 1)) / period;
                } else {
                    avgGain = (avgGain * (period - 1)) / period;
                    avgLoss = (avgLoss * (period - 1) - diff) / period;
                }
            }
            if (avgLoss === 0) return 100;
            let rs = avgGain / avgLoss;
            return 100 - (100 / (1 + rs));
        }

        // Анализ свечей и генерация технического сигнала
        async function analyzeTechnicalSignal() {
            const btn = document.getElementById('gen-btn');
            const dirElement = document.getElementById('signal-direction');
            const priceElement = document.getElementById('stat-price');
            const rsiElement = document.getElementById('stat-rsi');
            const stopElement = document.getElementById('stat-stop');
            const takeElement = document.getElementById('stat-take');
            const statusElement = document.getElementById('scan-status');

            btn.innerText = "Анализ 15м свечей...";
            btn.disabled = true;
            dirElement.className = "text-xl font-bold my-2 text-yellow-400 animate-pulse";
            dirElement.innerText = "Расчет RSI и структуры...";

            try {
                // Запрашиваем 50 свечей таймфрейма 15 минут
                let res = await fetch(`https://fapi.binance.com/fapi/v1/klines?symbol=${currentSymbol}&interval=15m&limit=50`);
                let klines = await res.json();

                let closes = klines.map(k => parseFloat(k[4])); // Цены закрытия
                let highs = klines.map(k => parseFloat(k[2]));  // Максимумы свечей
                let lows = klines.map(k => parseFloat(k[3]));   // Минимумы свечей

                let currentPrice = closes[closes.length - 1];
                let rsi = calculateRSI(closes);

                // Определение локальных экстремумов для технических стопов
                let recentLow = Math.min(...lows.slice(-5));
                let recentHigh = Math.max(...highs.slice(-5));

                let stopLoss = 0;
                let takeProfit = 0;

                // Торговая логика на основе RSI и структуры
                if (rsi < 45) {
                    // Зона перепроданности / отскок снизу -> СИГНАЛ LONG
                    stopLoss = recentLow * 0.995; // Чуть ниже локального минимума
                    let risk = currentPrice - stopLoss;
                    takeProfit = currentPrice + (risk * 2.2); // Тейк с соотношением 1 к 2.2

                    dirElement.className = "text-2xl font-black my-2 text-green-400";
                    dirElement.innerText = "🚀 СИГНАЛ: LONG";
                } else {
                    // Зона силы / перекупленности -> СИГНАЛ SHORT от сопротивления
                    stopLoss = recentHigh * 1.005; // Чуть выше локального максимума
                    let risk = stopLoss - currentPrice;
                    takeProfit = currentPrice - (risk * 2.2);

                    dirElement.className = "text-2xl font-black my-2 text-red-400";
                    dirElement.innerText = "📉 СИГНАЛ: SHORT";
                }

                priceElement.innerText = "$" + (currentPrice < 1 ? currentPrice.toFixed(5) : currentPrice.toFixed(2));
                rsiElement.innerText = rsi.toFixed(1) + (rsi < 40 ? " ( Oversold )" : rsi > 60 ? " ( Overbought )" : " ( Neutral )");
                stopElement.innerText = "$" + (stopLoss < 1 ? stopLoss.toFixed(5) : stopLoss.toFixed(2));
                takeElement.innerText = "$" + (takeProfit < 1 ? takeProfit.toFixed(5) : takeProfit.toFixed(2));
                statusElement.innerText = `Анализ 15м завершен | ${currentName}`;

                if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');

            } catch (e) {
                dirElement.className = "text-lg font-bold my-2 text-red-500";
                dirElement.innerText = "Ошибка загрузки свечей";
            } finally {
                btn.innerText = "🎯 АНАЛИЗАТОР СВЕЧЕЙ (RSI + EMA)";
                btn.disabled = false;
            }
        }

        // Сканер горячих монет с вычислением технического сетапа
        async function scanWildMarket() {
            const btn = document.getElementById('scan-btn');
            const dirElement = document.getElementById('signal-direction');
            const priceElement = document.getElementById('stat-price');
            const rsiElement = document.getElementById('stat-rsi');
            const stopElement = document.getElementById('stat-stop');
            const takeElement = document.getElementById('stat-take');
            const statusElement = document.getElementById('scan-status');

            btn.innerText = "Сканирую стаканы...";
            btn.disabled = true;
            dirElement.className = "text-xl font-bold my-2 text-purple-400 animate-pulse";
            dirElement.innerText = "Поиск сильного импульса...";

            try {
                let res = await fetch('https://fapi.binance.com/fapi/v1/ticker/24hr');
                let allFutures = await res.json();

                let activeFutures = allFutures.filter(f => f.symbol.endsWith('USDT') && parseFloat(f.quoteVolume) > 15000000);
                activeFutures.sort((a, b) => Math.abs(parseFloat(b.priceChangePercent)) - Math.abs(parseFloat(a.priceChangePercent)));

                let hotContract = activeFutures[Math.floor(Math.random() * Math.min(10, activeFutures.length))];
                let coinSymbol = hotContract.symbol;
                let coinName = coinSymbol.replace('USDT', '/USDT');
                let price = parseFloat(hotContract.lastPrice);
                let change = parseFloat(hotContract.priceChangePercent);

                setScannedPair(coinSymbol, coinName, "🔥");

                // Загружаем свечи для найденной монеты
                let klinesRes = await fetch(`https://fapi.binance.com/fapi/v1/klines?symbol=${coinSymbol}&interval=15m&limit=30`);
                let klines = await klinesRes.json();
                let closes = klines.map(k => parseFloat(k[4]));
                let lows = klines.map(k => parseFloat(k[3]));
                let highs = klines.map(k => parseFloat(k[2]));

                let rsi = calculateRSI(closes);
                let recentLow = Math.min(...lows.slice(-4));
                let recentHigh = Math.max(...highs.slice(-4));

                let stopLoss = 0;
                let takeProfit = 0;

                if (change < 0) {
                    stopLoss = recentLow * 0.99;
                    let risk = price - stopLoss;
                    takeProfit = price + (risk * 2);
                    dirElement.className = "text-2xl font-black my-2 text-green-400";
                    dirElement.innerText = "🚀 ТОП LONG СЕТАП";
                } else {
                    stopLoss = recentHigh * 1.01;
                    let risk = stopLoss - price;
                    takeProfit = price - (risk * 2);
                    dirElement.className = "text-2xl font-black my-2 text-red-400";
                    dirElement.innerText = "📉 ТОП SHORT СЕТАП";
                }

                statusElement.innerText = `🔥 Найдено: ${coinName} (${change > 0 ? '+' : ''}${change.toFixed(2)}%)`;
                priceElement.innerText = "$" + (price < 0.01 ? price.toFixed(6) : price.toFixed(3));
                rsiElement.innerText = rsi.toFixed(1) + " (RSI)";
                stopElement.innerText = "$" + (stopLoss < 0.01 ? stopLoss.toFixed(6) : stopLoss.toFixed(2));
                takeProfit.innerText = "$" + (takeProfit < 0.01 ? takeProfit.toFixed(6) : takeProfit.toFixed(2));

                if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');

            } catch (e) {
                dirElement.className = "text-lg font-bold my-2 text-red-500";
                dirElement.innerText = "Ошибка сканера";
            } finally {
                btn.innerText = "🔥 ИСКАТЬ ТОП-ИМПУЛЬС (LIVE)";
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
